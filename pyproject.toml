[project]
name = "compliance"
version = "0.2.0"
description = "Evidence-grounded video compliance audit POC"
requires-python = ">=3.13,<3.14"

dependencies = [
    "azure-identity==1.25.3",
    "azure-monitor-opentelemetry==1.8.9",
    "azure-search-documents==12.0.0",
    "fastapi==0.141.1",
    "langgraph==1.2.11",
    "langsmith==0.12.1",
    "openai==3.7.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.5",
    "pypdf==6.16.2",
    "python-dotenv==1.2.3",
    "requests==2.34.2",
    "uvicorn==0.52.4",
    "yt-dlp==2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "httpx>=0.28,<1",
    "ruff>=0.12,<1",
    "pip-audit>=2,<3",
    "mypy>=1.15,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]